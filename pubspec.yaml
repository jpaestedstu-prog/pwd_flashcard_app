name: pwdpwdpwd
description: "Interactive Flashcard App for PWD Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local Storage
  hive_flutter: ^1.1.0

  # Animations
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # UI
  google_fonts: ^6.2.1
  auto_size_text: ^3.0.0
  percent_indicator: ^4.2.5
  fl_chart: ^0.69.0
  gap: ^3.0.1
  flutter_staggered_animations: ^1.1.1

  # Audio / TTS
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0

  # Video
  video_player: ^2.9.3

  # Camera + on-device object recognition (Word Hunt feature).
  # google_mlkit_image_labeling bundles the base ML Kit model inside the
  # APK, so labeling runs fully offline — no backend, no paid tier.
  camera: ^0.11.0
  google_mlkit_image_labeling: ^0.14.0

  # Video / asset caching (used by core/services/fsl_assets_service.dart
  # to download each FSL video on first play and serve it from disk
  # thereafter — primary source is GitHub Releases, with Streamable as a
  # runtime fallback; see assets/data/fsl_video_manifest.json)
  flutter_cache_manager: ^3.4.1

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  audioplayers: ^6.5.1
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  file_picker: ^8.3.7

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Cloud Sync (Firebase)
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  connectivity_plus: ^6.1.4

  # Telemetry (Firebase free tier — unlimited on Spark plan).
  # Opt-in only; parent-gated toggle in settings. Default OFF.
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Cryptography (PIN hashing)
  crypto: ^3.0.3

  # ─── TV Casting (universal local-network cast) ──────
  # Pure-Dart HTTP server bundle. No native plugins — keeps the
  # project free from Kotlin/KGP conflicts (Flutter 3.44 ships
  # Kotlin 2.0.0 while many cast SDKs need 2.2.0+).
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  # QR code rendering (pure Dart CustomPainter).
  qr_flutter: ^4.1.0

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Direct dev dep so tests can install a fake ConnectivityPlatform
  # (already in the dependency graph via connectivity_plus).
  connectivity_plus_platform_interface: ^2.1.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/categories/
    - assets/images/flashcards/
    - assets/images/onboarding/
    - assets/images/games/
    - assets/animations/
    - assets/sounds/
    - assets/data/
    # TV-side static web assets (HTML/CSS/JS) served by the
    # in-app shelf server for the TV Cast feature.
    - assets/tv_cast/
    # FSL videos are not bundled — FslAssetsService downloads each one on
    # first play (GitHub Releases primary, Streamable fallback) and caches
    # it on-device. See assets/data/fsl_video_manifest.json.
    - google_fonts/
